name: Build Baconsistent (Windows)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Baconsistent source version
        shell: pwsh
        run: |
          $mod = Get-Content -Raw ./mod.json | ConvertFrom-Json
          Write-Host "Baconsistent source version: $($mod.version)"
          if ($mod.version -ne "v0.6.0") {
            throw "Wrong/stale repository root. Expected Baconsistent v0.6.0, got $($mod.version)."
          }
          $required = @(
            "./src/main.cpp",
            "./src/ui/TrainingPopup.cpp",
            "./src/core/TrainingStats.cpp",
            "./src/runtime/StartPosAnalyzer.cpp",
            "./src/runtime/ProfileRegistry.cpp",
            "./src/ui/ProfileCreatePopup.cpp",
            "./src/ui/ProfileManagerPopup.cpp",
            "./src/ui/Theme.cpp",
            "./src/ui/PauseProgressBar.cpp",
            "./src/ui/ProgressNotification.cpp",
            "./src/core/AttemptGuard.cpp",
            "./src/core/NoclipHitDetector.cpp",
            "./src/core/LegacySession.cpp",
            "./src/ui/LegacyImportPopup.cpp",
            "./src/ui/StageEditorLayer.cpp",
            "./src/ui/StageEditorLayer.hpp",
            "./src/core/StageLayoutDraft.hpp",
            "./resources/pause-icon.png",
            "./resources/header-brand.png",
            "./resources/night-header-brand.png",
            "./resources/tm-header-brand.png",
            "./resources/tm-flag.png",
            "./resources/tm-emblem.png",
            "./resources/ud-header-brand.png",
            "./resources/ud-flag.png",
            "./resources/ud-emblem.png",
            "./resources/ud-panel-card.png",
            "./resources/ud-panel-card-dark.png",
            "./resources/ud-tab-pill.png",
            "./resources/ud-tab-pill-active.png",
            "./resources/ud-stage-row.png",
            "./resources/ud-stage-row-selected.png",
            "./resources/ud-stage-row-complete.png",
            "./resources/ud-progress-track.png",
            "./resources/ud-progress-fill.png",
            "./resources/ud-round-ribbon.png",
            "./resources/ud-bacon-separator.png",
            "./resources/tt-header-brand.png",
            "./resources/tt-flag.png",
            "./resources/tt-emblem.png",
            "./resources/tt-panel-card.png",
            "./resources/tt-panel-card-dark.png",
            "./resources/tt-tab-pill.png",
            "./resources/tt-tab-pill-active.png",
            "./resources/tt-stage-row.png",
            "./resources/tt-stage-row-selected.png",
            "./resources/tt-stage-row-complete.png",
            "./resources/tt-progress-track.png",
            "./resources/tt-progress-fill.png",
            "./resources/tt-round-ribbon.png",
            "./resources/tt-bacon-separator.png",
            "./resources/stage-row.png",
            "./resources/round-ribbon.png"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing v0.6.0 source/resource: $path" }
          }

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload Baconsistent
        uses: actions/upload-artifact@v7
        with:
          name: Baconsistent-v0.6.0-Windows
          path: ${{ steps.build.outputs.build-output }}
