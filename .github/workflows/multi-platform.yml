name: Build Baconsistent Windows

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  regression:
    name: Training regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test counters and production run tracking
        run: python3 tests/run.py

  build:
    name: Windows
    needs: regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
      - uses: actions/upload-artifact@v4
        with:
          name: Baconsistent-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
